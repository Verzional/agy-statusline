<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 468" width="100%" role="img" aria-label="agy-statusline responsive tiers preview">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #8b949e; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #c9d1d9; }
      .session { fill: #af87ff; }
      .model { fill: #ff8787; }
      .edit { fill: #ffd75f; }
      .work { fill: #ff8700; }
      .sub { fill: #5fd7ff; }
      .task { fill: #ffffaf; }
      .green { fill: #4ade80; }
      .yellow { fill: #facc15; }
      .dim { fill: #6e7681; }
    </style>
  </defs>

  <!-- Outer Terminal Window -->
  <rect x="0.5" y="0.5" width="1039" height="467" rx="12" fill="#0d1117" stroke="#30363d" />
  <path d="M 1 12 Q 1 1 12 1 L 1028 1 Q 1039 1 1039 12 L 1039 36 L 1 36 Z" fill="#161b22" />
  <line x1="1" y1="36" x2="1039" y2="36" stroke="#30363d" />
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5.5" fill="#27c93f" />
  <text x="520" y="22" text-anchor="middle" class="title">agy-statusline — Responsive Layout Tiers</text>

  <!-- Tier 1: Wide (135+ cols) -->
  <text x="24" y="60" class="label">Wide (135+ cols)</text>
  <rect x="24" y="67" width="992" height="34" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="38" y="88" text-anchor="start" class="mono">
    <tspan class="session">Alcove</tspan><tspan class="dim"> │ </tspan><tspan class="model">Gemini 4 Hydrogen (Low)</tspan><tspan class="dim"> │ </tspan><tspan class="edit">Edits</tspan><tspan class="dim"> │ </tspan><tspan class="work">Working</tspan><tspan class="dim"> │ </tspan><tspan class="sub">Sub 2/24</tspan><tspan class="dim"> │ </tspan><tspan class="task">Task 3/5</tspan>
  </text>
  <text x="1002" y="88" text-anchor="end" class="mono">
    <tspan class="green">Wk [█████</tspan><tspan class="dim">·</tspan><tspan class="green">] 95.98%</tspan><tspan class="dim"> │ </tspan><tspan class="green">5h [█████</tspan><tspan class="dim">·</tspan><tspan class="green">] 86.41%</tspan><tspan class="dim"> │ </tspan><tspan class="green">Ctx [█</tspan><tspan class="dim">·····</tspan><tspan class="green">] 26.42%</tspan>
  </text>

  <!-- Tier 2: Medium (105-134 cols) -->
  <text x="24" y="138" class="label">Medium (105–134 cols)</text>
  <rect x="24" y="145" width="820" height="34" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="38" y="166" text-anchor="start" class="mono">
    <tspan class="session">Alcove</tspan><tspan class="dim"> │ </tspan><tspan class="model">Gemini 4 Hydrogen (Low)</tspan><tspan class="dim"> │ </tspan><tspan class="edit">Edits</tspan><tspan class="dim"> │ </tspan><tspan class="work">Working</tspan><tspan class="dim"> │ </tspan><tspan class="sub">Sub 2/24</tspan><tspan class="dim"> │ </tspan><tspan class="task">Task 3/5</tspan>
  </text>
  <text x="830" y="166" text-anchor="end" class="mono">
    <tspan class="green">Wk 95.98%</tspan><tspan class="dim"> │ </tspan><tspan class="green">5h 86.41%</tspan><tspan class="dim"> │ </tspan><tspan class="green">Ctx 26.42%</tspan>
  </text>

  <!-- Tier 3: Half-Screen Split (75-104 cols) -->
  <text x="24" y="216" class="label">Half-Screen Split (75–104 cols)</text>
  <rect x="24" y="223" width="630" height="34" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="38" y="244" text-anchor="start" class="mono">
    <tspan class="model">Hydrogen (Low)</tspan><tspan class="dim"> │ </tspan><tspan class="edit">Edits</tspan><tspan class="dim"> │ </tspan><tspan class="work">Working</tspan><tspan class="dim"> │ </tspan><tspan class="sub">Sub 2/24</tspan>
  </text>
  <text x="640" y="244" text-anchor="end" class="mono">
    <tspan class="green">Wk 95.98%</tspan><tspan class="dim"> │ </tspan><tspan class="green">5h 86.41%</tspan><tspan class="dim"> │ </tspan><tspan class="green">Ctx 26.42%</tspan>
  </text>

  <!-- Tier 4: Sidebar (50-74 cols) -->
  <text x="24" y="294" class="label">Sidebar (50–74 cols)</text>
  <rect x="24" y="301" width="440" height="34" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="38" y="322" text-anchor="start" class="mono">
    <tspan class="model">Hydrogen (L)</tspan><tspan class="dim"> │ </tspan><tspan class="work">Working</tspan>
  </text>
  <text x="450" y="322" text-anchor="end" class="mono">
    <tspan class="green">Wk 96%</tspan><tspan class="dim"> │ </tspan><tspan class="green">5h 86%</tspan><tspan class="dim"> │ </tspan><tspan class="green">Ctx 26%</tspan>
  </text>

  <!-- Tier 5: Emergency (Under 50 cols) -->
  <text x="24" y="372" class="label">Emergency (Under 50 cols — surfaces urgent quota ≤ 20%, otherwise Ctx %)</text>
  <rect x="24" y="379" width="290" height="34" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="38" y="400" text-anchor="start" class="mono">
    <tspan class="model">Hydrogen (L)</tspan><tspan class="dim"> │ </tspan><tspan class="work">Working</tspan>
  </text>
  <text x="300" y="400" text-anchor="end" class="mono">
    <tspan class="yellow">5h 14%</tspan>
  </text>
  <text x="328" y="400" text-anchor="start" class="label">or</text>
  <rect x="350" y="379" width="290" height="34" rx="6" fill="#161b22" stroke="#30363d" />
  <text x="364" y="400" text-anchor="start" class="mono">
    <tspan class="model">Hydrogen (L)</tspan><tspan class="dim"> │ </tspan><tspan class="work">Working</tspan>
  </text>
  <text x="626" y="400" text-anchor="end" class="mono">
    <tspan class="green">Ctx 26%</tspan>
  </text>
</svg>